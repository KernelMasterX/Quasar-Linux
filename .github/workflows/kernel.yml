name: Quasar Linux Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev libiberty-dev dwarves cpio busybox-static grub-pc-bin grub-common xorriso mtools

      - name: Kernel'i indir
        run: |
          curl -L -O https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.63.tar.xz
          tar -xf linux-6.18.63.tar.xz

      - name: Kernel'i Yapılandır ve Derle
        run: |
          cd linux-6.18.63
          make defconfig

          # --- CONSOLE + TTY ---
          ./scripts/config --enable CONFIG_VT
          ./scripts/config --enable CONFIG_VT_CONSOLE
          ./scripts/config --enable CONFIG_VGA_CONSOLE
          ./scripts/config --enable CONFIG_DUMMY_CONSOLE
          ./scripts/config --enable CONFIG_TTY
          ./scripts/config --enable CONFIG_PRINTK
          ./scripts/config --enable CONFIG_SERIAL_8250_CONSOLE
          ./scripts/config --enable CONFIG_EARLY_PRINTK

          # --- STD (Bochs) + CIRRUS ikisi de açık ---
          ./scripts/config --enable CONFIG_DRM
          ./scripts/config --enable CONFIG_DRM_BOCHS
          ./scripts/config --enable CONFIG_DRM_CIRRUS_QEMU
          ./scripts/config --enable CONFIG_FB
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_DRM_FBDEV_EMULATION

          # --- DISK ---
          ./scripts/config --enable CONFIG_ATA
          ./scripts/config --enable CONFIG_ATA_PIIX
          ./scripts/config --enable CONFIG_SATA_AHCI
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_ISO9660_FS

          # --- INITRAMFS ---
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_BLK_DEV_RAM
          ./scripts/config --enable CONFIG_RD_GZIP

          make olddefconfig
          make -j$(nproc) bzImage

      - name: Minimal Initramfs (RootFS) Oluştur
        run: |
          rm -rf initramfs
          mkdir -p initramfs/{bin,sbin,etc,proc,sys,dev,root}
          cd initramfs

          cp $(which busybox) bin/busybox
          chmod +x bin/busybox
          ./bin/busybox --install -s bin

          sudo mknod -m 600 dev/console c 5 1 || mknod -m 600 dev/console c 5 1
          sudo mknod -m 666 dev/null c 1 3 || mknod -m 666 dev/null c 1 3
          sudo mknod -m 666 dev/tty c 5 0 || mknod -m 666 dev/tty c 5 0

          cat << 'EOF' > init
          #!/bin/sh
          export PATH=/bin:/sbin
          export TERM=linux
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev
          [ -e /dev/console ] || mknod -m 600 /dev/console c 5 1
          echo "======================================"
          echo "  Quasar Linux'a Hos Geldin Kanka! "
          echo "======================================"
          exec /bin/sh
          EOF

          chmod +x init
          find . -print0 | cpio --null -ov --format=newc > ../linux-6.18.63/initramfs.cpio
          cd ..

      - name: Bootable ISO Oluştur (GRUB)
        run: |
          mkdir -p iso/boot/grub
          cp linux-6.18.63/arch/x86/boot/bzImage iso/boot/bzImage
          cp linux-6.18.63/initramfs.cpio iso/boot/initramfs.cpio

          cat << 'EOF' > iso/boot/grub/grub.cfg
          set timeout=5
          set default=0

          menuentry "Quasar Linux" {
              linux /boot/bzImage console=tty0 console=ttyS0 loglevel=7 earlyprintk=vga init=/init root=/dev/ram0 rw
              initrd /boot/initramfs.cpio
          }
          EOF

          grub-mkrescue -o quasar-linux.iso iso

      - name: ISO Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: quasar-linux-iso
          path: quasar-linux.iso
