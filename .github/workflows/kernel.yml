name: Quasar Linux Build (5.15 LTS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev libiberty-dev dwarves cpio busybox-static grub-pc-bin grub-common xorriso mtools file

      - name: Kernel 5.15 LTS İndir
        run: |
          curl -L -O https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.225.tar.xz
          tar -xf linux-5.15.225.tar.xz

      - name: Kernel'i Yapılandır ve Derle
        run: |
          cd linux-5.15.225
          make defconfig

          # --- Emülatör ve Sanallaştırma Uyumluluğu ---
          ./scripts/config --enable CONFIG_HYPERVISOR_GUEST
          ./scripts/config --enable CONFIG_KVM_GUEST
          ./scripts/config --enable CONFIG_PARAVIRT

          # --- CONSOLE + TTY + SERIAL ---
          ./scripts/config --enable CONFIG_VT
          ./scripts/config --enable CONFIG_VT_CONSOLE
          ./scripts/config --enable CONFIG_VGA_CONSOLE
          ./scripts/config --enable CONFIG_DUMMY_CONSOLE
          ./scripts/config --enable CONFIG_TTY
          ./scripts/config --enable CONFIG_PRINTK
          ./scripts/config --enable CONFIG_SERIAL_8250
          ./scripts/config --enable CONFIG_SERIAL_8250_CONSOLE
          ./scripts/config --enable CONFIG_EARLY_PRINTK

          # --- FRAMEBUFFER / VIDEO (Limbo QEMU uyumlu) ---
          ./scripts/config --enable CONFIG_FB
          ./scripts/config --enable CONFIG_FB_VESA
          ./scripts/config --enable CONFIG_FB_EFI
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_DRM
          ./scripts/config --enable CONFIG_DRM_BOCHS
          ./scripts/config --enable CONFIG_DRM_CIRRUS_QEMU
          ./scripts/config --enable CONFIG_DRM_FBDEV_EMULATION

          # --- DISK + DOSYA SISTEMLERI ---
          ./scripts/config --enable CONFIG_ATA
          ./scripts/config --enable CONFIG_ATA_PIIX
          ./scripts/config --enable CONFIG_SATA_AHCI
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_ISO9660_FS
          ./scripts/config --enable CONFIG_TMPFS

          # --- INITRAMFS ---
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_BLK_DEV_RAM
          ./scripts/config --enable CONFIG_RD_GZIP

          # --- KERNEL PANIC KONTROLU ---
          ./scripts/config --set-val CONFIG_PANIC_TIMEOUT 0

          make olddefconfig
          make -j$(nproc) bzImage

      - name: Minimal Initramfs (RootFS) Oluştur
        run: |
          rm -rf initramfs
          mkdir -p initramfs/{bin,sbin,etc,proc,sys,dev,root,tmp}
          cd initramfs

          sudo mknod -m 622 dev/console c 5 1
          sudo mknod -m 666 dev/null c 1 3

          cp /bin/busybox bin/busybox
          chmod +x bin/busybox
          ./bin/busybox --install -s bin
          ./bin/busybox --install -s sbin

          cat << 'EOF' > init
          #!/bin/sh
          export PATH=/bin:/sbin
          export TERM=linux

          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev
          mount -t tmpfs none /tmp

          echo 1 > /proc/sys/kernel/printk

          clear
          echo "=========================================="
          echo "   Quasar Linux (5.15 LTS) Hos Geldin!    "
          echo "=========================================="
          echo ""

          exec setsid cttyhack /bin/sh
          EOF

          chmod +x init
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../linux-5.15.225/initramfs.cpio.gz
          cd ..

      - name: Bootable ISO Oluştur (GRUB)
        run: |
          mkdir -p iso/boot/grub
          cp linux-5.15.225/arch/x86/boot/bzImage iso/boot/bzImage
          cp linux-5.15.225/initramfs.cpio.gz iso/boot/initramfs.cpio.gz

          cat << 'EOF' > iso/boot/grub/grub.cfg
          set timeout=3
          set default=0

          menuentry "Quasar Linux 5.15 (Standard)" {
              set gfxpayload=text
              linux /boot/bzImage console=tty0 console=ttyS0,115200 noapic nolapic rdinit=/init
              initrd /boot/initramfs.cpio.gz
          }

          menuentry "Quasar Linux 5.15 (Safe Mode)" {
              set gfxpayload=text
              linux /boot/bzImage console=tty0 console=ttyS0,115200 noapic nolapic nomodeset earlyprintk=serial,ttyS0,115200 loglevel=7 rdinit=/init
              initrd /boot/initramfs.cpio.gz
          }
          EOF

          grub-mkrescue -o quasar-linux.iso iso
          ls -lh quasar-linux.iso

      - name: ISO Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: quasar-linux-iso
          path: quasar-linux.iso
